<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sistema de Gestión Académica</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/style.css}">

</head>

<body>

    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card auth-card border-0 bg-white">
            <div class="auth-header">
                <span class="badge bg-white text-primary mb-2 fw-bold px-3 py-1 text-uppercase"
                    style="border-radius: 6px;">Uniremington</span>
                <h3 class="fw-bold mb-0">Acceso al Sistema</h3>
                <p class="small text-white-50 mt-1 mb-0">Gestión Académica</p>
            </div>

            <div class="card-body p-4 p-md-5">

                <!-- Alerta dinámica que solo aparece si hay un error de credenciales -->
                <div th:if="${error}" class="alert alert-danger text-center fw-bold shadow-sm" role="alert">
                    <span th:text="${error}"></span>
                </div>

                <!-- FORMULARIO CORREGIDO: Las etiquetas form encierran el botón para que funcione -->
                <form th:action="@{/auth/procesar}" method="post">

                    <!-- ÚNICO CAMPO: Usuario (Número de Documento) -->
                    <div class="mb-4">
                        <label class="form-label fw-bold text-dark">Usuario</label>
                        <input type="text" name="username" class="form-control form-control-lg bg-light"
                            placeholder="Número de documento" required>
                    </div>

                    <!-- ÚNICO CAMPO: Contraseña -->
                    <div class="mb-5">
                        <label class="form-label fw-bold text-dark">Contraseña</label>
                        <input type="password" name="password" class="form-control form-control-lg bg-light"
                            placeholder="••••••••" required>
                    </div>

                    <!-- BOTÓN INGRESAR -->
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg fw-bold shadow-sm">
                            Ingresar
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
