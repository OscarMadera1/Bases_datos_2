<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Terceros</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <h1>Gestión de Terceros</h1>
        <a href="/" class="btn-back">Volver al Menú Principal</a>

        <!-- Formulario para registrar -->
        <form th:action="@{/terceros/guardar}" th:object="${tercero}" method="post" class="form-card">
            <h2>Registrar Nuevo Tercero</h2>
            <div class="form-grid">
                <input type="number" th:field="*{id}" placeholder="ID (TERC_ID)" required>
                <input type="text" th:field="*{tipoDoc}" placeholder="Tipo Doc (ej. CC)" maxlength="2" required>
                <input type="text" th:field="*{nroDoc}" placeholder="Número de Documento" maxlength="10" required>
                <input type="text" th:field="*{genero}" placeholder="Género (M/F)" maxlength="1" required>
                <input type="text" th:field="*{nombres}" placeholder="Nombres" maxlength="50" required>
                <input type="text" th:field="*{apellidos}" placeholder="Apellidos" maxlength="50" required>
                <input type="text" th:field="*{direccion}" placeholder="Dirección" maxlength="50">
                <input type="email" th:field="*{correo}" placeholder="Correo Electrónico" maxlength="50">
                <input type="text" th:field="*{movil}" placeholder="Móvil" maxlength="10">
                <input type="text" th:field="*{tipo}" placeholder="Tipo" maxlength="1" required>
            </div>
            <button type="submit" class="btn-primary">Guardar Tercero</button>
        </form>

        <!-- Tabla para listar -->
        <div class="table-card">
            <h2>Lista de Terceros Registrados</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Documento</th>
                        <th>Nombres</th>
                        <th>Apellidos</th>
                        <th>Correo</th>
                        <th>Móvil</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="t : ${terceros}">
                        <td th:text="${t.id}"></td>
                        <td th:text="${t.tipoDoc + ' ' + t.nroDoc}"></td>
                        <td th:text="${t.nombres}"></td>
                        <td th:text="${t.apellidos}"></td>
                        <td th:text="${t.correo}"></td>
                        <td th:text="${t.movil}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <script src="/app.js"></script>
</body>
</html>
