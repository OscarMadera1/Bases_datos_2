<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-Matrícula | Sistema de Gestión Académica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/style.css}">
    <style>
        .semestre-header { background-color: #0d6efd; color: white; padding: 10px 15px; font-weight: bold; cursor: pointer; border-radius: 5px; margin-bottom: 5px; display: flex; justify-content: space-between; }
        .asignatura-item { background-color: #f8f9fa; border: 1px solid #dee2e6; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #0d6efd; margin-bottom: 3px; border-radius: 4px; }
        .asignatura-item:hover { background-color: #e9ecef; }
        .filtro-btn.active { background-color: #0d6efd; color: white; border-color: #0d6efd; }
    </style>
</head>
<body>
    <div class="container py-4">
        <div class="d-flex justify-content-end mb-2">
            <div id="liveClock" class="reloj-institucional text-end">Cargando fecha y hora...</div>
        </div>
        <a th:href="@{/portalMatricula}" class="text-decoration-none text-white-50 mb-3 d-inline-block">&larr; Volver al portal</a>

        <div class="text-center text-white mb-4">
            <span class="badge bg-primary px-3 py-2 mb-2 text-uppercase tracking-wider">Módulo Académico</span>
            <h1 class="display-6 fw-bold">Pre-Matrícula de Estudiantes</h1>
            <p class="lead text-light opacity-75 fs-6">Consulte las materias pendientes por cursar de un estudiante.</p>
        </div>

        <!-- FILTROS DE BÚSQUEDA -->
        <div class="card card-menu card-glass shadow border-0 p-4 mb-4">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label fw-bold text-dark small mb-1">1. Seleccione Estudiante:</label>
                    <select id="estudianteSelect" class="form-select">
                        <option value="">Seleccione...</option>
                        <option th:each="est : ${estudiantes}" th:value="${est.id}"
                            th:text="${est.nroDoc + ' - ' + est.nombres + ' ' + est.apellidos}">
                        </option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold text-dark small mb-1">2. Programa Académico:</label>
                    <select id="programaSelect" class="form-select">
                        <option value="">Seleccione programa...</option>
                        <option th:each="prog : ${programas}" th:value="${prog.id}" th:text="${prog.nombre}"></option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold text-dark small mb-1">3. Pensum Asignado:</label>
                    <div class="input-group">
                        <select id="pensumSelect" class="form-select" disabled>
                            <option value="">Esperando programa...</option>
                        </select>
                        <button id="btnConsultarFaltantes" class="btn btn-primary fw-bold px-4">Consultar</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ÁREA DE RESULTADOS -->
        <div id="areaResultados" class="card card-menu card-glass shadow border-0 p-4 d-none">
            
            <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4">
                <div>
                    <h4 class="fw-bold text-primary mb-1">Materias Pendientes</h4>
                    <p class="text-muted small mb-0">Estudiante: <strong id="nombreEstudianteRes"></strong></p>
                </div>
                <span class="badge bg-danger fs-6" id="totalPendientesBadge">0 Pendientes</span>
            </div>

            <!-- Controles de Tabla: Buscador y Botones de Filtro -->
            <div class="row mb-4 align-items-center">
                <div class="col-md-5">
                    <input type="text" id="buscadorMaterias" class="form-control" placeholder="🔍 Buscar materia o código...">
                </div>
                <div class="col-md-7 text-end" id="botonesFiltroNivel">
                    <!-- Los botones de los semestres se generan dinámicamente aquí -->
                </div>
            </div>

            <!-- Contenedor del Acordeón / Lista -->
            <div id="contenedorMaterias">
                <!-- Data inyectada por JS -->
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/app.js}"></script>
</body>
</html>
