<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Asignaturas</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- DataTables Bootstrap 5 CSS -->
    <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <!-- Cabecera -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 fw-bold text-dark">Gestión de Asignaturas</h1>
                <a href="/" class="text-decoration-none text-muted">&larr; Volver al Menú Principal</a>
            </div>
            <!-- Botón para abrir el Modal de Registro -->
            <button type="button" class="btn btn-primary" onclick="abrirModalRegistrarAsignatura()">
                + Registrar Nueva Asignatura
            </button>
        </div>

        <!-- Tabla Estilo Bootstrap / DataTables -->
        <div class="card shadow-sm border-0">
            <div class="card-body">
                <h2 class="h5 mb-3 text-secondary">Lista de Asignaturas Registradas</h2>
                <div class="table-responsive">
                    <table id="tablaAsignaturas" class="table table-striped table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Nombre Asignatura</th>
                                <th>Créditos</th>
                                <th>Código</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="a : ${asignaturas}">
                                <td th:text="${a.id}"></td>
                                <td th:text="${a.asignatura}"></td>
                                <td th:text="${a.creditos}"></td>
                                <td th:text="${a.codigo}"></td>
                                <td class="text-center">
                                    <button type="button" class="btn btn-warning btn-sm fw-bold me-1" 
                                            th:onclick="editarAsignatura([[${a.id}]], [[${a.asignatura}]], [[${a.creditos}]], [[${a.codigo}]])">
                                        Editar
                                    </button>
                                    <a th:href="@{/asignaturas/eliminar/{id}(id=${a.id})}" 
                                       class="btn btn-danger btn-sm fw-bold" 
                                       onclick="return confirm('¿Está seguro de eliminar esta asignatura?');">
                                        Eliminar
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Bootstrap Centrado para Registrar / Editar Asignatura -->
    <div class="modal fade" id="asignaturaModal" tabindex="-1" aria-labelledby="modalTitleAsig" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content shadow">
                <form id="asignaturaForm" th:action="@{/asignaturas/guardar}" th:object="${asignaturaObj}" method="post">
                    <div class="modal-header bg-dark text-white">
                        <h5 class="modal-title" id="modalTitleAsig">Registrar Nueva Asignatura</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <!-- Campo oculto para el ID en modo actualización -->
                        <input type="hidden" th:field="*{id}" id="asigId">
                        
                        <div class="row g-3">
                            <div class="col-md-12">
                                <label class="form-label fw-bold">Nombre de la Asignatura</label>
                                <input type="text" th:field="*{asignatura}" id="asigNombre" class="form-control" placeholder="Nombre" maxlength="50" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Créditos</label>
                                <input type="number" th:field="*{creditos}" id="asigCreditos" class="form-control" placeholder="Ej. 3" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Código</label>
                                <input type="text" th:field="*{codigo}" id="asigCodigo" class="form-control" placeholder="Ej. SIS101" maxlength="6" required>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary" id="btnSubmitAsig">Guardar Asignatura</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts externos necesarios -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    
    <!-- Archivo JS centralizado -->
    <script src="/app.js"></script>
</body>
</html>
