<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Asignaturas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <div class="container py-4">
        <div class="d-flex justify-content-end mb-2">
            <div id="liveClock" class="reloj-institucional text-end">Cargando...</div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4 text-white">
            <div>
                <span class="badge bg-primary px-3 py-1 mb-2 text-uppercase">Uniremington</span>
                <h1 class="h3 fw-bold">Gestión de Asignaturas</h1>
                <a href="/portal" class="text-decoration-none text-white-50">&larr; Volver al Portal</a>
            </div>
            <button type="button" class="btn btn-primary fw-bold px-4 py-2 shadow"
                onclick="abrirModalRegistrarAsignatura()">
                + Registrar Nueva Asignatura
            </button>
        </div>

        <div class="card card-glass border-0 shadow">
            <div class="card-body">
                <h2 class="h5 mb-3 text-dark fw-bold">Lista de Asignaturas</h2>
                <div class="table-responsive">
                    <table id="tablaAsignaturas" class="table table-striped table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Créditos</th>
                                <th>Código</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="a : ${asignaturas}">
                                <td th:text="${a.id}"></td>
                                <td th:text="${a.nombre}"></td> <!-- CAMBIO AQUÍ -->
                                <td th:text="${a.creditos}"></td>
                                <td th:text="${a.codigo}"></td>
                                <td class="text-center">
                                    <button type="button" class="btn btn-warning btn-sm fw-bold me-1"
                                        th:data-id="${a.id}" th:data-nombre="${a.nombre}"
                                        th:data-creditos="${a.creditos}" th:data-codigo="${a.codigo}"
                                        onclick="editarAsignatura(this)">
                                        Editar
                                    </button>
                                    <a th:href="@{/asignaturas/eliminar/{id}(id=${a.id})}"
                                        class="btn btn-danger btn-sm fw-bold ms-1"
                                        onclick="return confirm('¿Está seguro de eliminar esta asignatura?');">
                                        Eliminar
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="asignaturaModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content shadow border-0">
                <!-- Sin th:action fijo para que el JS lo maneje dinámicamente -->
                <form id="asignaturaForm" th:object="${asigModel}" method="post">
                    <div class="modal-header bg-dark text-white">
                        <h5 class="modal-title" id="modalTitleAsig">Registrar</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body bg-light text-dark">
                        <!-- ID oculto -->
                        <input type="hidden" th:field="*{id}" id="asigId">

                        <div class="row g-3">
                            <div class="col-md-12">
                                <label class="form-label fw-bold">Nombre</label>
                                <input type="text" th:field="*{nombre}" id="asigNombre" class="form-control" required>
                                <!-- CAMBIO AQUÍ -->
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Créditos</label>
                                <input type="number" th:field="*{creditos}" id="asigCreditos" class="form-control"
                                    required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Código</label>
                                <input type="text" th:field="*{codigo}" id="asigCodigo" class="form-control" required>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer bg-light">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary" id="btnSubmitAsig">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script src="/app.js"></script>
</body>

</html>
