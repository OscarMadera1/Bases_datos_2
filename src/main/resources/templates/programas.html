<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Programas</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <h1>Gestión de Programas</h1>
        <a href="/" class="btn-back">Volver al Menú Principal</a>

        <!-- Formulario -->
        <form th:action="@{/programas/guardar}" th:object="${programa}" method="post" class="form-card">
            <h2>Registrar Nuevo Programa</h2>
            <div class="form-grid">
                <input type="number" th:field="*{id}" placeholder="ID Programa" required>
                <input type="text" th:field="*{nombre}" placeholder="Nombre del Programa" maxlength="100" required>
            </div>
            <button type="submit" class="btn-primary">Guardar Programa</button>
        </form>

        <!-- Tabla -->
        <div class="table-card">
            <h2>Lista de Programas Registrados</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre del Programa</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${programas}">
                        <td th:text="${p.id}"></td>
                        <td th:text="${p.nombre}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <script src="/app.js"></script>
</body>
</html>
