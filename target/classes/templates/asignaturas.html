<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Asignaturas</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <h1>Gestión de Asignaturas</h1>
        <a href="/" class="btn-back">Volver al Menú Principal</a>

        <form th:action="@{/asignaturas/guardar}" th:object="${asignatura}" method="post" class="form-card">
            <h2>Registrar Nueva Asignatura</h2>
            <div class="form-grid">
                <input type="number" th:field="*{id}" placeholder="ID Asignatura" required>
                <input type="text" th:field="*{nombre}" placeholder="Nombre Asignatura" maxlength="100" required>
                <input type="number" th:field="*{creditos}" placeholder="Créditos" required>
                <input type="text" th:field="*{codigo}" placeholder="Código" maxlength="20" required>
            </div>
            <button type="submit" class="btn-primary">Guardar Asignatura</button>
        </form>

        <div class="table-card">
            <h2>Lista de Asignaturas Registradas</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Créditos</th>
                        <th>Código</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="a : ${asignaturas}">
                        <td th:text="${a.id}"></td>
                        <td th:text="${a.nombre}"></td>
                        <td th:text="${a.creditos}"></td>
                        <td th:text="${a.codigo}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <script src="/app.js"></script>
</body>
</html>
