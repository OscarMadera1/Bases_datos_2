<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Programas</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- DataTables Bootstrap 5 CSS -->
    <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <style>
        .reloj-institucional {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.75);
            font-weight: 400;
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>
    <div class="container py-4">
        <!-- Fecha y Hora en tiempo real -->
        <div class="d-flex justify-content-end mb-2">
            <div id="liveClock" class="reloj-institucional text-end">Cargando fecha y hora...</div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4 text-white">
            <div>
                <span class="badge bg-primary px-3 py-1 mb-2 text-uppercase">Uniremington</span>
                <h1 class="h3 fw-bold">Gestión de Programas</h1>
                <a href="/" class="text-decoration-none text-white-50">&larr; Volver al Menú Principal</a>
            </div>
            <button type="button" class="btn btn-primary fw-bold px-4 py-2 shadow" onclick="abrirModalRegistrarPrograma()">
                + Registrar Nuevo Programa
            </button>
        </div>

        <div class="card card-glass border-0 shadow">
            <div class="card-body">
                <h2 class="h5 mb-3 text-dark fw-bold">Lista de Programas Registrados</h2>
                <div class="table-responsive">
                    <table id="tablaProgramas" class="table table-striped table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Nombre del Programa</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="p : ${programas}">
                                <td th:text="${p.id}"></td>
                                <td th:text="${p.programa}"></td>
                                <td class="text-center">
                                    <button type="button" class="btn btn-warning btn-sm fw-bold me-1" 
                                            th:onclick="editarPrograma([[${p.id}]], [[${p.programa}]])">
                                        Editar
                                    </button>
                                    <a th:href="@{/programas/eliminar/{id}(id=${p.id})}" 
                                       class="btn btn-danger btn-sm fw-bold" 
                                       onclick="return confirm('¿Está seguro de eliminar este programa?');">
                                        Eliminar
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Bootstrap Centrado -->
    <div class="modal fade" id="programaModal" tabindex="-1" aria-labelledby="modalTitleProg" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow border-0">
                <form id="programaForm" th:action="@{/programas/guardar}" th:object="${programaObj}" method="post">
                    <div class="modal-header bg-dark text-white">
                        <h5 class="modal-title" id="modalTitleProg">Registrar Nuevo Programa</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body bg-light text-dark">
                        <input type="hidden" th:field="*{id}" id="progId">
                        <div class="row g-3">
                            <div class="col-md-12">
                                <label class="form-label fw-bold">Nombre del Programa</label>
                                <input type="text" th:field="*{programa}" id="progNombre" class="form-control" placeholder="Ingrese el nombre" maxlength="50" required>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer bg-light">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary" id="btnSubmitProg">Guardar Programa</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script src="/app.js"></script>
</body>
</html>
