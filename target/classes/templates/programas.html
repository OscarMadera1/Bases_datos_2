<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Programas</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- DataTables Bootstrap 5 CSS -->
    <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <!-- Cabecera -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 fw-bold text-dark">Gestión de Programas</h1>
                <a href="/" class="text-decoration-none text-muted">&larr; Volver al Menú Principal</a>
            </div>
            <!-- Botón para abrir el Modal de Registro -->
            <button type="button" class="btn btn-primary" onclick="abrirModalRegistrarPrograma()">
                + Registrar Nuevo Programa
            </button>
        </div>

        <!-- Tabla Estilo Bootstrap / DataTables -->
        <div class="card shadow-sm border-0">
            <div class="card-body">
                <h2 class="h5 mb-3 text-secondary">Lista de Programas Registrados</h2>
                <div class="table-responsive">
                    <table id="tablaProgramas" class="table table-striped table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Nombre del Programa</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="p : ${programas}">
                                <td th:text="${p.id}"></td>
                                <td th:text="${p.programa}"></td>
                                <td class="text-center">
                                    <button type="button" class="btn btn-warning btn-sm fw-bold me-1" 
                                            th:onclick="editarPrograma([[${p.id}]], [[${p.programa}]])">
                                        Editar
                                    </button>
                                    <a th:href="@{/programas/eliminar/{id}(id=${p.id})}" 
                                       class="btn btn-danger btn-sm fw-bold" 
                                       onclick="return confirm('¿Está seguro de eliminar este programa?');">
                                        Eliminar
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Bootstrap Centrado para Registrar / Editar Programa -->
    <div class="modal fade" id="programaModal" tabindex="-1" aria-labelledby="modalTitleProg" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow">
                <form id="programaForm" th:action="@{/programas/guardar}" th:object="${programaObj}" method="post">
                    <div class="modal-header bg-dark text-white">
                        <h5 class="modal-title" id="modalTitleProg">Registrar Nuevo Programa</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <!-- Campo oculto para el ID en modo actualización -->
                        <input type="hidden" th:field="*{id}" id="progId">
                        
                        <div class="row g-3">
                            <div class="col-md-12">
                                <label class="form-label fw-bold">Nombre del Programa</label>
                                <input type="text" th:field="*{programa}" id="progNombre" class="form-control" placeholder="Ingrese el nombre" maxlength="50" required>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary" id="btnSubmitProg">Guardar Programa</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts externos necesarios -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    
    <!-- Archivo JS centralizado -->
    <script src="/app.js"></script>
</body>
</html>
