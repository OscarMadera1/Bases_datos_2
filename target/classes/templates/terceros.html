<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Terceros</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- DataTables Bootstrap 5 CSS -->
    <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<div class="container py-4">
    <!-- Fecha y Hora en tiempo real -->
    <div class="d-flex justify-content-end mb-2">
        <div id="liveClock" class="reloj-institucional text-end">Cargando fecha y hora...</div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4 text-white">
        <div>
            <span class="badge bg-primary px-3 py-1 mb-2 text-uppercase">Uniremington</span>
            <h1 class="h3 fw-bold">Gestión de Terceros</h1>
            <a href="/index" class="text-decoration-none text-white-50">&larr; Volver al Inicio</a>
        </div>
        <button type="button" class="btn btn-primary fw-bold px-4 py-2 shadow" onclick="abrirModalRegistrar()">
            + Registrar Nuevo Tercero
        </button>
    </div>

    <!-- Mensajes de Notificación (Alertas) -->
    <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show shadow-sm mb-4" role="alert">
        <strong class="me-2">Error de validación:</strong>
        <span th:text="${mensajeError}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show shadow-sm mb-4" role="alert">
        <span th:text="${mensajeExito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card card-glass border-0 shadow">
        <div class="card-body">
            <h2 class="h5 mb-3 text-dark fw-bold">Lista de Terceros Registrados</h2>
            <div class="table-responsive">
                <table id="tablaTerceros" class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Documento</th>
                        <th>Nombres</th>
                        <th>Apellidos</th>
                        <th>Correo</th>
                        <th>Móvil</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="t : ${terceros}">
                        <td th:text="${t.id}"></td>
                        <td th:text="${t.tipoDoc + ' ' + t.nroDoc}"></td>
                        <td th:text="${t.nombres}"></td>
                        <td th:text="${t.apellidos}"></td>
                        <td th:text="${t.correo}"></td>
                        <td th:text="${t.movil}"></td>
                        <td class="text-center">
                            <button type="button" class="btn btn-warning btn-sm fw-bold me-1"
                                    th:onclick="editarTercero([[${t.id}]], [[${t.tipoDoc}]], [[${t.nroDoc}]], [[${t.genero}]], [[${t.nombres}]], [[${t.apellidos}]], [[${t.direccion}]], [[${t.correo}]], [[${t.movil}]], [[${t.tipo}]])">
                                Editar
                            </button>
                            <a th:href="@{/terceros/eliminar/{id}(id=${t.id})}"
                               class="btn btn-danger btn-sm fw-bold"
                               onclick="return confirm('¿Está seguro de eliminar este tercero?');">
                                Eliminar
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Modal Bootstrap Centrado -->
<div class="modal fade" id="terceroModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content shadow border-0">
            <form id="terceroForm" th:action="@{/terceros/guardar}" th:object="${tercero}" method="post">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title" id="modalTitle">Registrar Nuevo Tercero</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body bg-light text-dark">
                    <input type="hidden" th:field="*{id}" id="tercId">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Tipo Doc</label>
                            <select th:field="*{tipoDoc}" id="tipoDoc" class="form-control" required>
                                <option value="">Seleccione tipo de documento</option>
                                <option value="CC">Cédula de Ciudadanía</option>
                                <option value="TI">Tarjeta de Identidad</option>
                                <option value="CE">Cédula de extranjería</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Nro Documento</label>
                            <input type="text" th:field="*{nroDoc}" id="nroDoc" class="form-control" placeholder="Número" maxlength="10" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Género</label>
                            <select th:field="*{genero}" id="genero" class="form-control" required>
                                <option value="">Seleccione género</option>
                                <option value="M">Masculino</option>
                                <option value="F">Femenino</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Nombres</label>
                            <input type="text" th:field="*{nombres}" id="nombres" class="form-control" maxlength="50" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Apellidos</label>
                            <input type="text" th:field="*{apellidos}" id="apellidos" class="form-control" maxlength="50" required>
                        </div>
                        <div class="col-md-12">
                            <label class="form-label fw-bold">Dirección</label>
                            <input type="text" th:field="*{direccion}" id="direccion" class="form-control" maxlength="50">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Correo Electrónico</label>
                            <input type="email" th:field="*{correo}" id="correo" class="form-control" maxlength="50">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Móvil</label>
                            <input type="text" th:field="*{movil}" id="movil" class="form-control" maxlength="10">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label fw-bold">Tipo</label>
                            <select th:field="*{tipo}" id="tipo" class="form-control" required>
                                <option value="">Seleccione tipo de rol</option>
                                <option value="0">Estudiante</option>
                                <option value="1">Profesor</option>
                                <option value="2">Administrativo</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="btnSubmit">Guardar Tercero</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
